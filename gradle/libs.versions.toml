[versions]
serialize = "1.6.3"
xml = "0.86.3"

[plugins]
spotless = "com.diffplug.gradle.spotless:8.1.0"

[libraries]
serialize-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialize" }
serialize-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialize" }
diffpatch = "io.codechicken:DiffPatch:1.5.0.30"
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
jgit = "org.eclipse.jgit:org.eclipse.jgit:7.5.0.202512021534-r"

xml-core = { module = "io.github.pdvrieze.xmlutil:core-jvm", version.ref = "xml" }
xml-serialize = { module = "io.github.pdvrieze.xmlutil:serialization-jvm", version.ref = "xml" }

# gradle
gradle-shadow = "com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.3.0"
gradle-plugin-publish = "com.gradle.publish:plugin-publish-plugin:1.3.0"
gradle-kotlin-jvm = { module = "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin" }
gradle-kotlin-dsl = { module = "org.gradle.kotlin.kotlin-dsl:org.gradle.kotlin.kotlin-dsl.gradle.plugin" }
